name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create the Android project
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          npx cap add android
          APPID=$(cat admob-app-id.txt | tr -d '[:space:]')
          python3 - "$APPID" <<'PY'
          import sys
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          tag = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % sys.argv[1]
          s = s.replace('</application>', tag + '\n    </application>', 1)
          open(p, 'w').write(s)
          PY
          npx capacitor-assets generate --android --assetPath . --iconBackgroundColor '#1f1547' --splashBackgroundColor '#1f1547'
          npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: city-crush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
